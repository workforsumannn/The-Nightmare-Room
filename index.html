<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Nightmare Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Custom Cursor SVG -->
    <svg id="cursor-icon" style="position:fixed; width:30px; height:30px; pointer-events:none; z-index:9999; fill:red;" viewBox="0 0 24 24">
        <path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9L12 2Z" />
    </svg>

    <div class="container">
        <h1>THE NIGHTMARE ROOM</h1>
        
        <div class="rules-box">
            <h2>RULES OF SURVIVAL</h2>
            <p class="rule-item">1. Do not look behind you.</p>
            <p class="rule-item">2. Silence is golden, but noise is deadly.</p>
            <p class="rule-item">3. You cannot leave until I allow it.</p>
            <p class="rule-item">4. Trust nothing.</p>
        </div>

        <div id="admin-message-area" style="margin-top: 20px; min-height: 50px; color: yellow; font-weight: bold;">
            <!-- Messages from Admin will appear here -->
        </div>

        <button id="exit-btn" class="exit-btn">EXIT</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
